name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs an id-token to prove the artifact came from this run.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should replace an in-flight one, not stack behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite gates the deploy: scoring and the scrubber are the product, and
      # a green board serving wrong arithmetic is worse than a board that is down.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
